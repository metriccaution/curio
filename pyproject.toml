[project]
name = "curio"
version = "0.1.0"
description = "Reference image gatherer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146.0",
    "imagehash>=4.3.2",
    "jinja2>=3.1.6",
    "pillow>=13.0.0",
    "pillow-avif-plugin>=1.5.2",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "ruff>=0.17.1",
    "uvicorn>=0.54.0",
    "yt-dlp>=2026.10.21",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
